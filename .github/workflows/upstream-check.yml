name: Check upstreams for new commits

# Reports commits on BoltzExchange/boltz-backend and SatsRouting/boltz-backend
# that are not in master yet. See .github/scripts/check-upstreams.sh for how
# merged and cherry-picked commits are told apart, and
# .github/upstream-verified-ignore.txt to silence commits checked and skipped.
on:
  schedule:
    - cron: '0 13 * * *' # daily, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for new upstream commits
        shell: bash
        run:
          .github/scripts/check-upstreams.sh origin/master | tee -a
          "$GITHUB_STEP_SUMMARY"
