name: CI

on:
  push:
    branches: [master]
  pull_request:

# Pull requests run only the jobs their changes can affect; pushes to master
# run everything, which also keeps the build caches current
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      rust: ${{ steps.filter.outputs.rust }}
      boltz-core: ${{ steps.filter.outputs.boltz-core }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Detect changed parts
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ci: &ci
              - '.github/**'
            rust: &rust
              - *ci
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'boltz-*/**'
              - 'boltzr/**'
              - 'boltzr-cli/**'
              - 'proto/**'
              - 'hold'
              - 'regtest'
              - 'tools/**'
            boltz-core:
              - *ci
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'boltz-core/**'
              - 'justfile'
            # The integration tests run the sidecar, so Rust changes count
            backend:
              - *rust
              - 'lib/**'
              - 'test/**'
              - 'bin/**'
              - 'package.json'
              - 'package-lock.json'
              - '*.js'
              - '*.mjs'
              - 'tsconfig*.json'
              - 'swagger-spec.json'
            api:
              - *ci
              - 'lib/**'
              - 'proto/**'
              - 'package.json'
              - 'package-lock.json'
              - 'swagger*'
              - 'tools/**'

  build:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        # Pinned so a new stable release does not invalidate every build
        # cache or fail clippy unannounced; bump it deliberately
        rust-version: ['1.100.0']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          node-version: ${{ matrix.node-version }}
          rust-version: ${{ matrix.rust-version }}
          cache-prefix: npm-rust-build

      - name: Start regtest
        id: start_regtest
        timeout-minutes: 10
        run: npm run regtest:start:ci && sudo chmod -R 777 regtest

      - name: Docker Logs
        if: failure() && steps.start_regtest.outcome == 'failure'
        run: |
          docker image ls -a
          docker ps -a
          cd regtest
          docker compose ps
          docker compose logs

      - name: Compile
        run: npm run compile

      - name: Type check tests
        run: npm run compile:typescript:test

      - name: Prettier
        run: npm run prettier:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- -w 2

      - name: Integration tests
        run: node run-int.js

  build-rust:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        # Pinned so a new stable release does not invalidate every build
        # cache or fail clippy unannounced; bump it deliberately
        rust-version: ['1.100.0']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          node-version: ${{ matrix.node-version }}
          rust-version: ${{ matrix.rust-version }}
          cache-prefix: cargo-build

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Install clippy
        run: rustup component add clippy

      - name: Start regtest
        id: start_regtest
        timeout-minutes: 10
        run: npm run regtest:start:ci && sudo chmod -R 777 regtest

      - name: Docker Logs
        if: failure() && steps.start_regtest.outcome == 'failure'
        run: |
          docker image ls -a
          docker ps -a
          cd regtest
          docker compose ps
          docker compose logs

      - name: Compile
        run: cargo build

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test
        env:
          MEMPOOL_API_URL: ${{ vars.MEMPOOL_API_URL }}

  build-boltz-core:
    needs: changes
    if:
      github.event_name == 'push' || needs.changes.outputs.boltz-core == 'true'
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        # Pinned so a new stable release does not invalidate every build
        # cache or fail clippy unannounced; bump it deliberately
        rust-version: ['1.100.0']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
        with:
          node-version: ${{ matrix.node-version }}
          rust-version: ${{ matrix.rust-version }}
          cache-prefix: cargo-boltz-core

      - name: Install just
        uses: extractions/setup-just@v4

      - name: boltz-core feature matrix
        run: just boltz-core-features

      - name: boltz-core docs
        run: just boltz-core-docs-features

  api-generation-validation:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.api == 'true'
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [ubuntu-latest]
        node-version: [24]
        python-version: ['3.14']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate proto files
        run: npm run proto

      - name: Check swagger spec is up to date
        run: |
          npm run swagger
          git diff --exit-code -- swagger-spec.json

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: OpenAPI Spec Validation
        run: npm run swagger:validate
