name: 'Setup Build Environment'
description: 'Setup common build environment for Boltz backend'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: true

  rust-version:
    description: 'Rust version to use'
    required: true

  cache-prefix:
    description: 'Key of the Rust build cache, one per kind of build'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 'Free disk space'
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true

    - name: Install build dependencies
      shell: bash
      run:
        sudo apt-get update && sudo apt-get -y install protobuf-compiler
        libsqlite3-dev

    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Use Rust toolchain
      id: rust-toolchain
      shell: bash
      run: |
        rustup update ${{ inputs.rust-version }} && rustup default ${{ inputs.rust-version }}
        echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Install Node.js dependencies
      shell: bash
      run: npm ci

    # Caches the dependencies and the cargo registry, not our own crates,
    # which change with nearly every commit. Saved only from master, which
    # pull requests restore from, so they do not fill the cache quota with
    # copies of their own
    - name: Rust build cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-prefix }}
        save-if: ${{ github.ref == 'refs/heads/master' }}
